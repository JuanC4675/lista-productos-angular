<h1>{{ title | uppercase }}</h1>
<p>Fecha: {{ today | date:'fullDate' }}</p>

<!-- Botón mostrar/ocultar -->
<button (click)="toggleList()">
  {{ showList ? 'Ocultar lista' : 'Mostrar lista' }}
</button>

<!-- Input para agregar producto -->
<div>
  <input [(ngModel)]="newProductName" placeholder="Nombre del producto">
  <input type="number" [(ngModel)]="newProductPrice" placeholder="Precio">
  <button (click)="addProduct()">Agregar</button>
</div>

<!-- Lista de productos -->
<div *ngIf="showList">
  <div style="display: flex; gap: 16px; flex-wrap: wrap; margin-top: 20px;">
    <app-product-card 
      *ngFor="let product of products"
      [name]="product.name"
      [price]="product.price"
      [image]="product.image">
    </app-product-card>
  </div>
</div>
